<div
  style="font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #726b4e"
>
  New message &nbsp;·&nbsp; {{ kind_label }}
</div>
<h1
  class="headline"
  style="margin: 18px 0 0; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 36px; font-weight: 500; line-height: 1.05; letter-spacing: -0.04em; color: #1d231d"
>
  {{ name }}<br />
  <em
    style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.015em"
    >{{ headline }}</em
  >
</h1>
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="margin-top: 30px"
>
  <tr>
    <td
      style="padding: 18px 20px; border-left: 2px solid #1a3122; background: #f4eee5; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.7; color: #1d231d"
    >
      {{{ message_html }}}
    </td>
  </tr>
</table>
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="margin-top: 30px; border-bottom: 1px solid #cfc9bb"
>
  {{{ detail_rows }}}
</table>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top: 32px">
  <tr>
    <td style="border-radius: 2px; background: #1a3122">
      <a
        href="{{ reply_url }}"
        style="display: inline-block; padding: 16px 26px; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; font-weight: 500; color: #f4eee5; text-decoration: none"
        >Reply to {{ first_name }} &nbsp;↗</a
      >
    </td>
  </tr>
</table>
<p
  style="margin: 16px 0 0; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 1.6; color: #67665b"
>
  Replying to this email goes straight to {{ email }}.
</p>
