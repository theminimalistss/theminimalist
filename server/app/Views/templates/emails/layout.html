<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{ subject }}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f4eee5;
      }
      a {
        color: #1a3122;
      }
      @media (max-width: 620px) {
        .shell {
          width: 100% !important;
        }
        .pad {
          padding-right: 24px !important;
          padding-left: 24px !important;
        }
        .headline {
          font-size: 30px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background: #f4eee5; -webkit-text-size-adjust: 100%">
    <span
      style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #f4eee5; font-size: 1px"
      >{{ preheader }}</span
    >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #f4eee5"
    >
      <tr>
        <td align="center" style="padding: 40px 12px">
          <table
            role="presentation"
            class="shell"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 600px; max-width: 600px"
          >
            <tr>
              <td class="pad" style="padding: 0 40px 28px">
                <a href="{{ site_url }}" style="text-decoration: none; color: #1d231d">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="padding-right: 14px; vertical-align: middle">
                        <img
                          src="{{ logo_url }}"
                          width="46"
                          height="35"
                          alt="The Minimalist lotus"
                          style="display: block; width: 46px; height: 35px; border: 0"
                        />
                      </td>
                      <td style="vertical-align: middle">
                        <div
                          style="font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: #1d231d"
                        >
                          THE MINIMALIST
                        </div>
                        <div
                          style="padding-top: 6px; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 9px; letter-spacing: 0.22em; line-height: 1; color: #1d231d"
                        >
                          DESIGN STUDIO
                        </div>
                      </td>
                    </tr>
                  </table>
                </a>
              </td>
            </tr>
            <tr>
              <td
                class="pad"
                style="padding: 44px 40px 40px; background: #fbf8f3; border: 1px solid #cfc9bb; border-radius: 2px"
              >
                {{{ content }}}
              </td>
            </tr>
            <tr>
              <td class="pad" style="padding: 32px 40px 0">
                <div
                  style="font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 500; letter-spacing: -0.035em; color: #1d231d"
                >
                  Less, but
                  <em
                    style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.01em"
                    >with feeling.</em
                  >
                </div>
                <div
                  style="padding-top: 16px; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; letter-spacing: 0.12em; line-height: 1.8; color: #67665b"
                >
                  EST. 2020 &nbsp;·&nbsp;
                  <a href="{{ site_url }}" style="color: #67665b; text-decoration: underline"
                    >{{ site_host }}</a
                  >
                  &nbsp;·&nbsp; {{ studio_email }}
                </div>
                <div
                  style="padding-top: 6px; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; line-height: 1.6; color: #67665b"
                >
                  Studio hours: {{ studio_hours }}. © {{ year }} {{ studio_name }}.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
